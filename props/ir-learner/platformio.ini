; IR learner — bench tool (2026-09-30)
;
; Classic ESP32 DevKit (ESP32-D0WD-V3, MAC AA:BB:CC:DD:EE:FF) + Dorhea 38kHz
; IR receiver/transmitter modules. Learns the LED controller's remote codes so
; they can be moved to a transmit-only ESP-01S node that fires on ESP-NOW cues
; (Zombie Container). Not a show node — no ESP-NOW here.
;
; Wiring:  RX module  S -> RX2 (GPIO16), VCC -> 3V3, GND -> GND
;          TX module  S -> TX2 (GPIO17), VCC -> 3V3, GND -> GND
;
; upload_speed 115200: esptool stub upload hit a checksum error at default
; speed on this board's first connect (2026-09-30).
;
; Build+flash: pio run -e ir_learner -t upload --upload-port /dev/ttyUSB0
; Monitor:     pio device monitor -p /dev/ttyUSB0 -b 115200

[env:ir_learner]
platform        = espressif32@6.12.0   ; Arduino 2.0.17, same as crows (ESP-NOW-safe)
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 115200
lib_deps        = crankyoldgit/IRremoteESP8266 @ ^2.8.6
