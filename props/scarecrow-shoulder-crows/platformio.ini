; Scarecrow shoulder crows (2026-09-29). Two crows on the Scarecrow's shoulders:
; one turns its head, one tilts. ESP32 + JZ-MOS switching the AITRIP MP3/amp's
; 5 V (the card holds only crows_loop.mp3). Follows the Scarecrow's show cues via
; shared/Shared_Constants/ShowFollower.h, like props/crows. See README.md.
[env:esp32dev]
platform = espressif32@6.12.0   ; = Arduino 2.0.17 / IDF 4.4.7, same as props/crows (7.x breaks the esp_now recv cb)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_filters = time, colorize
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
build_flags =
    -I${PROJECT_DIR}/../../shared/Shared_Constants
