; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; httpi have connected esp32 a1s and would like to make a simple sketch to check the MAc address. I have platformio installed and a new project started with this name s://docs.platformio.org/page/projectconf.html

; 2026-08-27: all property APs consolidated onto WiFi channel 11 (were split
; ch 1/6/11 for house / back-garage / front-yard; SSID "<your-ssid>" + password
; unchanged). Crows-proper listens on ESP-NOW, locked to ch 11 via ESPNOW_CHANNEL
; in src/main.cpp (2026-09-29). The src_range_explorer
; variant honours -DESPNOW_CHANNEL if set — use 11 if you add it.

[env:esp32dev]
platform = espressif32@6.12.0   ; = Arduino 2.0.17 / IDF 4.4.7, what the 2025 build used (7.x breaks the esp_now recv cb)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_filters = time, colorize
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
; 2026-09-29: crows follow the Scarecrow's show cues (quick mode during a visit).
; Wire format + follower rules come from the Harvest of Shadows repo, not copied.
build_flags =
    -I${PROJECT_DIR}/../../shared/Shared_Constants
