; Zombie Container IR lights (2026-09-30)
;
; ESP-01S IR transmitter that makes the Zombie Container's 44-key LED
; controller follow the PicoDMX show over ESP-NOW (listen-only):
; swamp (idle + CONTAINED) -> red alert (1:13.40) -> random white strobe
; (1:20.10 glass break) -> swamp (2:49.86 reset). Same trigger as
; props/zombie-relay-esp01s. See src/node/main.cpp header for failsafes/wiring.
; Effects + codes developed on props/ir-learner (codes.md).
;
; Flashed 2026-09-30 (fw 6797b52, boot-verified -> SWAMP): unit 1 MAC
; AA:BB:CC:DD:EE:FF, unit 2 MAC AA:BB:CC:DD:EE:FF (spare). Flash = adapter in
; PROG, ONE connection with --before no_reset (a 2nd connect fails on this
; adapter); check the MAC is not the relay (AA:BB:CC:DD:EE:FF) first.
;
; The deployed Zombie Container (relay + touchpad) is NOT modified by this.
;
; Node:   pio run -e zombie_ir -t upload --upload-port /dev/ttyUSB0
; Bench:  pio run -e bench_sender -t upload --upload-port /dev/ttyUSB0  (ESP32)
;         sends bench-only frames the live fleet ignores (include/bench_frame.h)

[env]
lib_extra_dirs  = ../../shared
monitor_speed   = 115200

[env:zombie_ir]
platform        = espressif8266 @ ^4.2.1
board           = esp01_1m
framework       = arduino
upload_speed    = 115200
upload_protocol = esptool
build_src_filter = +<node/>
lib_deps        = crankyoldgit/IRremoteESP8266 @ ^2.8.6
build_flags =
    -D THIS_NODE=NODE_ZOMBIE_CONTAINER
    -D _IR_ENABLE_DEFAULT_=false
    -D SEND_NEC=true

[env:bench_sender]
platform        = espressif32@6.12.0   ; Arduino 2.0.17, fleet-standard (7.x breaks esp_now recv cb)
board           = esp32dev
framework       = arduino
upload_speed    = 115200
build_src_filter = +<bench/>
