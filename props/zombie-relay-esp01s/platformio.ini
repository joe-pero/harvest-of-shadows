; Zombie Container relay — ESP-01S RELAY V4.0 (IOT-MCU)
;
; 2026-09-21: replaces the loose-wire GPIO32-to-bare-relay-module wiring on
; props/touchpad-ota-controller/ that ate an entire bench session (wrong P4
; pin, wire colors not matching the assumed harness mapping, a 3.3V-vs-5V
; VCC mismatch, and a missing shared ground — see docs/zombie-container.md
; "Touch UI redesigned" + PROJECT_LOG.md 2026-09-21). A self-contained
; ESP-01S relay board removes that whole class of problem: no loose signal/
; ground wires between two separate boards, no separate voltage rail to
; mismatch — it's one assembled unit with its own regulator + relay driver.
; It listens over ESP-NOW for the exact same CMD_SEGMENT_START/SEGMENT_ZOMBIE
; broadcast the touchpad already sends (no touchpad firmware changes needed)
; and drives its own onboard relay straight into the PicoDMX trigger.
;
; Board confirmed 2026-09-21: ESP8266EX, 1MB flash (esptool flash-id) —
; MAC AA:BB:CC:DD:EE:FF.
; Relay GPIO + logic level confirmed via IOT-MCU's own repo + the Tasmota
; template for this exact board (not guessed — see main.cpp header):
; GPIO0, active-LOW. Known quirk: GPIO0 doubles as the ESP8266 boot-strap
; pin, so a brief relay flicker at power-on/reset is a documented hardware
; limitation of this board, not a firmware bug.
;
; Build:   pio run -e zombie_relay
; Flash:   pio run -e zombie_relay -t upload --upload-port /dev/ttyUSB0

[env:zombie_relay]
platform        = espressif8266 @ ^4.2.1
board           = esp01_1m
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
upload_protocol = esptool
lib_extra_dirs  = ../../shared
build_flags =
    -D THIS_NODE=NODE_ZOMBIE_CONTAINER
