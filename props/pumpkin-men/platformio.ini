; Pumpkin Men — standalone build config
;
; Corrected 2026-09-16: this node is Tier 1, same three-flat-theme-track
; principle as Spooky Tree (props/spooky-tree/) — no cross-node handshake, no
; proximity zones. Board is the reused 2025 "Master Brain" / ACEBOTT ESP32 box
; (jaw relays + fog + skeleton prop), MAC_PUMPKIN_MEN in ProjectConstants.h.
;
; upload_protocol is USB (esptool). Pass --upload-port on the CLI, or add
; upload_port here once you know the device path.

[env:pumpkin_men]
platform         = espressif32@7.0.1
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
lib_extra_dirs   = ../../shared
lib_ldf_mode     = deep+
lib_deps         = majicDesigns/MD_YX5300
; FW_GIT = commit the bins were built from (+ "-dirty"), printed in every
; black-box boot header (shared/BlackBox).
build_flags      =
    -D THIS_NODE=NODE_PUMPKIN_MEN
    -D CORE_DEBUG_LEVEL=0          ; no framework [E] lines on the serial line (2026-10-01 cleanup)
    !echo "-D FW_GIT=\\\"$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- . ../../shared || echo -dirty)\\\""
upload_protocol  = esptool
