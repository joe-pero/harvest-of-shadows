; Skeleton Narrator A1S ("Burt") — ESP32-A1S (AI-Thinker Audio Kit v2.2)
;
; NodeID 0x07 (NODE_SKELETON_A1S), MAC AA:BB:CC:DD:EE:FF (bench-confirmed 2026-09-06).
; Same board + base firmware as the Scarecrow A1S; differs by NodeID, character,
; SD content set, and role (follower, not leader — no MQTT, no fleet-burst
; origination; the one Tier-2 partner of Scarecrow via §3.4 H1b).
;
; src/main.cpp = the Burt follower firmware (H1b partner of Scarecrow). Bench-
; validated 2026-09-06 (placeholder audio) + flashed 2026-09-08/09 with the real
; SD pool build + HOLD Part A + s/S/o/n standalone voice-check. HOLD Part B
; (segment selection + a real dedupe fix) + always-on ArduinoOTA (hostname
; "burt-a1s") added 2026-09-11 — see BUILD_LOG.md. No partition-scheme change
; needed (default.csv app slot is only 72.8% used with OTA in).
;
; FLASH GOTCHA (Burt board only) — REPORTED RESOLVED 2026-09-19, per Joe: it
; was the old microSD card itself (loading the GPIO12 flash-voltage strap),
; now replaced. This file's own prior standing bar was "treat any resolved
; report as unverified until repeated" (set 2026-09-11, after an earlier
; false "fixed" call) — that bar has NOT yet been independently re-confirmed
; across several power cycles as of this note. This unit had intermittently
; failed to flash — or even boot — with a card inserted; if it recurs with
; the NEW card too, pull the card before every flash as the historical
; workaround. See docs/a1s-board-and-audio-architecture.md and BUILD_LOG.md
; 2026-09-08/09 and 2026-09-11 for the full diagnostic history.

[env:skeleton]
platform         = espressif32@7.0.1
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_protocol  = esptool
upload_port      = /dev/ttyUSB0
monitor_port     = /dev/ttyUSB0
monitor_filters  = esp32_exception_decoder, time
lib_extra_dirs   = ../../shared
lib_ldf_mode     = deep+
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
