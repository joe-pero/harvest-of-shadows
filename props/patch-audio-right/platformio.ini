; Spatial audio patch node — RIGHT channel
;
; IDENTICAL firmware to patch-audio-left — this project shares that source tree
; via src_dir below, and only overrides THIS_NODE. The RIGHT/LEFT difference is
; the SD-card content (right-channel mixes) and this NodeID; nothing in the code.
;
; ⚠ Same hardware caveat as patch-audio-left: MP3 board assumed YX5300 — confirm
;   physically. MAC: read off the board on first flash, record vs MAC_PATCH_RIGHT.

[platformio]
src_dir = ../patch-audio-left/src

[env:patch_right]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
lib_extra_dirs  = ../../shared
lib_ldf_mode    = deep+
lib_deps        = majicDesigns/MD_YX5300
; FW_GIT = commit the bins were built from (+ "-dirty"), printed in every
; black-box boot header (shared/BlackBox). CORE_DEBUG_LEVEL=0: no framework
; [E] lines on the serial line (2026-10-01).
build_flags     =
    -D THIS_NODE=NODE_PATCH_RIGHT
    -D CORE_DEBUG_LEVEL=0
    !echo "-D FW_GIT=\\\"$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- ../../shared ../patch-audio-left ../patch-audio-right || echo -dirty)\\\""
