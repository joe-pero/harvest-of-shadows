; Zombie Container fog relay — standalone Arduino Nano (ATmega328P).
; Old-bootloader Nanos (most clones): use env nano_old.
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

[env:nano_old]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
