; Spooky Tree — standalone build config
;
; Migrated from Halloween-Dev/PlatformIO/Master Halloween Show 2026/nodes/spooky_tree/
; on 2026-09-04. This is now the source of truth for this node.
;
; upload_protocol is USB (esptool). Pass --upload-port on the CLI, or add
; upload_port here once you know the device path.

[env:spooky_tree]
platform         = espressif32@7.0.1
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
lib_extra_dirs   = ../../shared
lib_ldf_mode     = deep+
lib_deps         =
    majicDesigns/MD_YX5300
; FW_GIT = commit the bins were built from (+ "-dirty" if this prop or shared/
; had uncommitted changes). Printed in every black-box boot header.
build_flags      =
    -D THIS_NODE=NODE_SPOOKY_TREE
    -D CORE_DEBUG_LEVEL=0          ; no framework [E] lines on the serial line (2026-10-01 cleanup)
    !echo "-D FW_GIT=\\\"$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- . ../../shared || echo -dirty)\\\""
upload_protocol  = esptool
