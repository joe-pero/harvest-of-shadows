; Parkway MOSFET lights (2026-10-06): ESP32 DevKit (MAC AA:BB:CC:DD:EE:FF,
; CP2102) driving a Hilitand 4-channel MOSFET PWM module (input 3-20 V,
; output 3.7-27 VDC 10 A). Will work like the Eave/area lights (CmdPacket
; follower) with swamp water + red alert / amber strobe effects.
;
; WIRING (bench 2026-10-06):
;   ESP GPIO25 -> module PWM1 +    ESP GPIO26 -> PWM2 +
;   ESP GPIO27 -> module PWM3 +    ESP GPIO33 -> PWM4 + (was 32)
;   module input GND1..GND4 -> ESP GND (daisy-chained). The 4 input GNDs did
;   NOT beep to each other on a continuity test = likely opto-isolated inputs.
;   No strapping pins used (avoid 0/2/5/12/15, 1/3, 6-11, 34-39 input-only).
; !! 3.3 V GPIO is NOT enough to switch this module (2026-10-06): GPIO25 HIGH
; !! -> channel's blue input LED only faint, light OFF; jumper ESP 5V -> PWM1+
; !! -> light ON. Needs a 5 V driver per channel (NPN low-side or 74AHCT125);
; !! do NOT use a BSS138 "level shifter" board (10k pull-ups can't feed the opto).
; -> SWITCHED 2026-10-06 (Joe's call): Hilitand module dropped; each channel is
;    now its own Ceksezx dual-MOSFET trigger module (5-36 V, 15 A, 0-20 kHz PWM),
;    which Joe has used before. Same GPIOs: TRIG/PWM <- GPIO, signal GND <- ESP GND.
; 2026-10-07: board + Hilitand module BLEW (ESP32 AA:BB:CC:DD:EE:FF dead). Replaced
;    with ESP32-D0WD-V3 MAC AA:BB:CC:DD:EE:FF (CP2102); CH4 moved GPIO32 -> GPIO33.
;    POWER RULE: never PC USB + AC/DC converter on VIN at the same time.
; CHANNEL MAP (probed 2026-10-07, Joe by eye): CH1 GPIO25 = RED, CH2 GPIO26 = GREEN,
;    CH3 GPIO27 = AQUA BLUE (first read dark = loose wire, reseated),
;    CH4 GPIO33 = AMBER.
;
; env show  = show firmware (src/show/): follows the Zombie Container timeline like
;              props/zombie-dmx-light: SWAMP idle (R/G/B), RED ALERT 1:13.40 (red),
;              STROBE 1:20.10 (amber = the "white" strobe, Joe 10-07), SWAMP 2:49.86.
; env probe = bench tool (src/probe/): serial-controlled channels, one at a time.
; This board's serial link is marginal (read_flash failed at 921600/460800/
; 115200, odd 15.55 MHz crystal reading) -> upload at 115200.

[env]
lib_extra_dirs  = ../../shared

[env:show]
platform        = espressif32@6.12.0   ; Arduino 2.0.17, fleet-standard (ESP-NOW-safe)
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 115200
build_src_filter = +<show/>
build_flags =
    -D THIS_NODE=NODE_PARKWAY_1

[env:probe]
platform        = espressif32@6.12.0   ; Arduino 2.0.17, fleet-standard
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 115200
build_src_filter = +<probe/>
