; Stain Glass Window + Front Door projection controller — 2026 mono-repo node
;
; ONE ESP32 (MAC AA:BB:CC:DD:EE:FF = MAC_STAIN_GLASS, last year's board) runs both
; projections, ~5 ft apart (Joe 2026-10-03):
;   window player  BrightSign 4K1142  UART2  TX 17 / RX 16  MAX3232 -> DE-9   115200
;   door player    BrightSign XT1143  UART1  TX 22 / RX 21  HW-027  -> 3.5mm 115200
;   window proj    Hitachi CP-X605    soft   TX 26 / RX 27  MAX3232 -> DE-9   19200
;   door proj      Hitachi CP-DW10N   soft   TX 32 / RX 35  MAX3232 -> DE-9   19200
;   No IR (Joe 2026-10-03: projector power over RS-232 only).
; All modules on 3V3. Docs: docs/stain-glass-window.md, docs/front-door.md.
;
; env:bench = wiring/bench test firmware only (serial console commands), no show logic.

[env:bench]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
build_src_filter = +<bench/>
lib_deps        =
    plerup/EspSoftwareSerial@^8.2.0

; env:show = the bench file + the show listener (2026-10-07): ESP-NOW from the Scarecrow -> ShowFollower ->
; theme fires door (GPIO) + window (serial ACTION) at MAIN-SHOW. All bench console commands still work.
; 2026-10-20: + src/show/ha_proj.* = projector power switches in Home Assistant (WiFi + HA broker).
[env:show]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
lib_extra_dirs  = ../../shared
lib_ldf_mode    = deep+
build_src_filter = +<bench/> +<show/>
build_flags     =
    -D SG_SHOW
    -D THIS_NODE=NODE_STAIN_GLASS
    !echo "-D FW_GIT=\\\"$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- . ../../shared || echo -dirty)\\\""
lib_deps        =
    plerup/EspSoftwareSerial@^8.2.0
    knolleary/PubSubClient@^2.8.0
