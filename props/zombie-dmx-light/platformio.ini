; Zombie Container DMX light (2026-09-30), the higher-resolution light Joe is
; building to replace/augment the IR background lights.
;
; ESP32 DevKit (MAC AA:BB:CC:DD:EE:FF, the former ir-learner board) -> DIYables
; TTL-to-RS485 module (hardware auto flow control, 3.3 V) -> par can DMX IN.
;   module VCC -> 3V3, GND -> GND, **ESP TX2 (GPIO17) -> module TXD**,
;   module RXD -> NOT CONNECTED (it is the module's OUTPUT; 5 V if VCC = 5 V)
;   !! The module's TXD/RXD labels are from the MCU's side (TX->TX). The DIYables
;   !! esp32io tutorial says the opposite and is WRONG for this board: with ESP TX
;   !! on RXD the bus never moved (meter: A/B fixed whatever the input). Found
;   !! 2026-09-30 after ~2 h; confirmed by a buyer review + the fixture lighting.
;   fixture XLR pin 1 (black) -> module GND pad, pin 2 (red) -> B-, pin 3 (yellow) -> A+
; Fixture: menu d.xxx = DMX mode + start address (bench: d.001). CHANNEL MAP
; (probed 2026-09-30 with Joe watching, offsets from the start address):
;   +0 master dimmer (colors show nothing while it is 0)
;   +1 red   +2 green   +3 blue   +4 white
;   +5 mode/program: 0 = manual colors, 200 = built-in color fade (other
;      ranges not mapped yet)
;   +6 strobe / program speed: 255 in manual = fast strobe on the set color,
;      with a program = faster program
; Test gotcha: 1 channel at a time shows nothing, because master must be up.
;
; env dmx_show  = the show firmware (src/show/): ESP-NOW trigger + timeline +
;                 failsafes, same as props/zombie-ir-lights. Flash via
;                 yard-bridge-pi (USB) - no OTA (Joe).
; env dmx_probe = bench tool (src/probe/): serial-controlled DMX, effect previews.

[env]
lib_extra_dirs  = ../../shared

[env:dmx_show]
platform        = espressif32@6.12.0   ; Arduino 2.0.17, fleet-standard
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 115200
build_src_filter = +<show/>
lib_deps        = someweisguy/esp_dmx @ ^4.1.0
build_flags =
    -D THIS_NODE=NODE_ZOMBIE_CONTAINER
    -D FIXTURE_BASE=1

[env:dmx_probe]
platform        = espressif32@6.12.0   ; Arduino 2.0.17, fleet-standard
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_speed    = 115200               ; this board: stub checksum error at default speed
build_src_filter = +<probe/>
lib_deps        = someweisguy/esp_dmx @ ^4.1.0
