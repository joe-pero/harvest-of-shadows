; Singing Pumpkins — 2026 mono-repo node
;
; ⚠ SCAFFOLD ONLY (2026-09-06). This builds the 2026 ESP-NOW listen structure +
;   the active/idle mode switch as STUBS. It does NOT yet contain the real node.
;
;   Media engine: BrightSign XT1143 (2026-09-06 — replaces the 2025 DV68/MediaWiz).
;   Serial: 3.5mm TRS jack on the player (Tip=RX, Ring=TX, Sleeve=GND), 115200 8N1,
;   via a MAX3232 3.5mm adapter into a spare ESP32 HardwareSerial (Serial1).
;
;   Still to port from `Projects/Singing pumpkins V2/`: the content-selection
;   model (`tracks.h` pools/faces/durations, Phase A/B, Fisher-Yates song shuffle
;   + anti-repeat), the 2× FX relays (GPIO25/26), and IR projector control IF the
;   projector is a separate ESP32-controlled unit. `dv68.cpp` is DROPPED.
;   Roadmap: node is PENDING. See docs/singing-pumpkins.md.
;
; Node identity: NODE_SINGING_PUMPKINS (0x05), MAC_SINGING_PUMPKINS (reserved).
; Tier 1, receive-only (docs/singing-pumpkins.md, docs/fleet-communication-tiers.md).

[env:singing_pumpkins]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
lib_extra_dirs  = ../../shared
lib_ldf_mode    = deep+
build_flags     =
    -D THIS_NODE=NODE_SINGING_PUMPKINS
lib_deps        =
    knolleary/PubSubClient@^2.8.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6   ; projector POWER over IR (src/projector_ir.*), same lib as props/ir-learner
