; Touchpad "god-mode" override panel  ·  NODE_OTA_CONTROLLER (0x0B)
;
; ⚠ STARTING FRAMEWORK (2026-09-06) — not final firmware.
;   Present: WiFi ch11 + ESP-NOW listener, momentary relay-pulse logic for the
;   Zombie Container PicoDMX trigger, RGB-LED DMX-state indicator, SHOW_ACTIVE_MS
;   (210 s) constant, OTA-broadcast + e-stop hooks.
;   Deferred: the touch UI (ST7796S + XPT2046 — TFT_eSPI / LovyanGFX), the
;   "media/WiZ player" control (device unconfirmed — ASK JOE), the Singing
;   Pumpkins jukebox UI + cue.
;
; Board: Hosyond 4.0" 320x480, ESP32-32E (ESP32-D0WD-V3), ST7796S resistive
;   touch, RGB LED, microSD, UART, Type-C. Pinout: lcdwiki.com/4.0inch_ESP32-32E_Display
; MAC: read off the board on first flash, record vs MAC_OTA_CONTROLLER.
;
; See docs/zombie-container.md.

[env:touchpad_ota_controller]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
lib_extra_dirs  = ../../shared
lib_ldf_mode    = deep+
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -D THIS_NODE=NODE_OTA_CONTROLLER
    -D LGFX_USE_V1
