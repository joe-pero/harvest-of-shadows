; Scarecrow Narrator A1S — ESP32-A1S (AI-Thinker Audio Kit v2.2)
;
; NodeID 0x06 (NODE_SCARECROW_A1S), MAC AA:BB:CC:DD:EE:FF.
; This board is ALSO the fleet leader / WiFi->ESP-NOW bridge
; (docs/a1s-board-and-audio-architecture.md Part 3).
;
; Bench board confirmed 2026-09-06: ESP32-D0WD-V3 rev 3.1, 4 MB flash,
; CP2102 USB-serial on /dev/ttyUSB0, MAC matches MAC_SCARECROW_A1S.
;
; src/main.cpp is the integration firmware (Steps 4+5): fleet leader (WiFi ch11 +
; ESP-NOW), INTRO/MIDDLE/OUTRO playback path, Scarecrow<->Burt H1b handshake.
; Validated on the bench 2026-09-06 with placeholder audio (no SD card / no live
; vision pipeline yet). The Step 1 characterization sketch is archived at
; bench/characterize_main.cpp.txt.
;
; FLASH NOTE: WiFi+HTTPClient+SD_MMC pushed the app to ~81% of the 1.25 MB app
; slot in default.csv — too tight for OTA's two-app-partition layout, so
; board_build.partitions is now min_spiffs.csv (1.9 MB per app slot) ahead of
; adding ArduinoOTA (2026-09-11).

[env:scarecrow]
platform                = espressif32@7.0.1
board                   = esp32dev
framework               = arduino
board_build.partitions  = min_spiffs.csv
monitor_speed           = 115200
upload_protocol         = esptool
upload_port             = /dev/ttyUSB0
monitor_port            = /dev/ttyUSB0
monitor_filters         = esp32_exception_decoder, time
lib_extra_dirs          = ../../shared
lib_ldf_mode            = deep+
lib_deps =
    knolleary/PubSubClient@^2.8.0
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; platform 7.0.1 LDF quirk: FS include dir not propagated to sibling
    ; bundled libs (SD_MMC). Add it explicitly.
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src

; OTA upload path (2026-09-16) — same firmware/build_flags as [env:scarecrow],
; just a network upload instead of USB, for pushing a fix to the installed,
; already-deployed board. First real use of ArduinoOTA (added 2026-09-11,
; never exercised via platformio before tonight). Auth password is read from
; the OTA_PASSWORD env var at invocation time, never written to this file —
; see wifi_credentials.h (gitignored) for the real value.
[env:scarecrow_ota]
extends                 = env:scarecrow
upload_protocol         = espota
upload_port             = scarecrow-a1s.local
upload_flags            = --auth=${sysenv.OTA_PASSWORD}
