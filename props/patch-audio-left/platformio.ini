; Spatial audio patch node — LEFT channel
;
; ESP32 + YX5300 serial-MP3 board + SD + one powered speaker (LEFT channel of the
; pre-mixed theme soundscape). Tier 1, receive-only (docs/patch-audio-nodes.md).
; Same firmware as patch-audio-right — that project's platformio.ini points its
; src_dir here so there is exactly ONE source tree.
;
; ⚠ HARDWARE NOT PHYSICALLY CONFIRMED: MP3 board assumed YX5300 (matching the
;   Spooky Tree precedent + MD_YX5300 lib). Verify the chip/board silkscreen
;   before flashing; if it's a YX5200/JQ6500/DFPlayer variant the MD_YX5300
;   command set still largely applies but re-check the warm-handshake.
;
; MAC: read off the board on first flash and record against MAC_PATCH_LEFT.

[env:patch_left]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
upload_protocol = esptool
lib_extra_dirs  = ../../shared
lib_ldf_mode    = deep+
lib_deps        = majicDesigns/MD_YX5300
; FW_GIT = commit the bins were built from (+ "-dirty"), printed in every
; black-box boot header (shared/BlackBox). CORE_DEBUG_LEVEL=0: no framework
; [E] lines on the serial line (2026-10-01).
build_flags     =
    -D THIS_NODE=NODE_PATCH_LEFT
    -D CORE_DEBUG_LEVEL=0
    !echo "-D FW_GIT=\\\"$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- ../../shared ../patch-audio-left ../patch-audio-right || echo -dirty)\\\""
