name: tests
on: [push, pull_request]
jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "paho-mqtt>=2,<3"
      - name: Use the credentials template (no real credentials in CI)
        run: cp orchestration/mqtt_credentials.py.template orchestration/mqtt_credentials.py
      - name: Show logic, theme deck, banter, live clock, hardening, insert fitting, demo night
        working-directory: orchestration
        run: |
          for t in test_controller test_theme_deck test_banter_select test_slot_fit test_live_clock test_live_hardening test_demo; do
            echo "::group::$t"; python $t.py; echo "::endgroup::"
          done
      - name: AI content screen
        run: python orchestration/vision/test_screen.py
      - name: Simulated night runs
        working-directory: orchestration
        run: python -m showsim.demo --groups 20

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scarecrow-narrator-a1s, dir: props/scarecrow-narrator-a1s, env: scarecrow }
          - { name: skeleton-narrator-a1s, dir: props/skeleton-narrator-a1s, env: skeleton }
          - { name: spooky-tree, dir: props/spooky-tree, env: spooky_tree }
          - { name: pumpkin-men, dir: props/pumpkin-men, env: pumpkin_men }
          - { name: patch-audio-left, dir: props/patch-audio-left, env: patch_left }
          - { name: patch-audio-right, dir: props/patch-audio-right, env: patch_right }
          - { name: singing-pumpkins, dir: props/singing-pumpkins, env: singing_pumpkins }
          - { name: crows, dir: props/crows, env: esp32dev }
          - { name: scarecrow-shoulder-crows, dir: props/scarecrow-shoulder-crows, env: esp32dev }
          - { name: zombie-relay-esp01s, dir: props/zombie-relay-esp01s, env: zombie_relay }
          - { name: zombie-dmx-light, dir: props/zombie-dmx-light, env: dmx_show }
          - { name: zombie-ir-lights, dir: props/zombie-ir-lights, env: zombie_ir }
          - { name: parkway-mosfet, dir: props/parkway-mosfet, env: show }
          - { name: stain-glass-window, dir: props/stain-glass-window, env: show }
          - { name: zombie-fog-nano, dir: props/zombie-fog-nano, env: nano }
          - { name: touchpad-ota-controller, dir: props/touchpad-ota-controller, env: touchpad_ota_controller }
          - { name: first-follower-follower, dir: examples/first-follower, env: follower }
          - { name: first-follower-test_sender, dir: examples/first-follower, env: test_sender }
    name: firmware (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.dir)) }}
      - run: pip install platformio
      - name: Use the credentials template (no real credentials in CI)
        run: cp shared/Shared_Constants/wifi_credentials.h.template shared/Shared_Constants/wifi_credentials.h
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: pio run -e ${{ matrix.env }}
