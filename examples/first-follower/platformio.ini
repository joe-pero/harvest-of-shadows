; First follower prop: the smallest prop that joins the Harvest of Shadows cue network.
; Guide: README.md in this folder. Two programs, one per board:
;
;   pio run -e follower    -t upload    ; the prop: blinks a pattern per theme on cue
;   pio run -e test_sender -t upload    ; stands in for the Scarecrow, for testing without a show
;
; Needs nothing but an ESP32 dev board (the built-in LED does the "show").

[platformio]
default_envs = follower

[env]
platform        = espressif32@7.0.1
board           = esp32dev
framework       = arduino
monitor_speed   = 115200
lib_extra_dirs  = ../../shared
lib_ldf_mode    = deep+

[env:follower]
build_src_filter = +<follower/>

[env:test_sender]
build_src_filter = +<sender/>
